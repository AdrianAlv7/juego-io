<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>UI Arcade</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: radial-gradient(circle at top, #0f172a, #020617);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', sans-serif;
    color: white;
}

/* CONTENEDOR */
.container {
    width: 420px;
}

/* INPUT SUPERIOR */
.input-top {
    width: 100%;
    padding: 15px 20px;
    border-radius: 50px;
    border: none;
    outline: none;
    font-size: 16px;
    background: #020617;
    color: #38bdf8;

    box-shadow:
        0 0 10px #38bdf8,
        0 0 20px rgba(56,189,248,0.5),
        inset 0 0 10px rgba(56,189,248,0.3);

    transition: 0.3s;
}

.input-top::placeholder {
    color: rgba(56,189,248,0.6);
}

.input-top:focus {
    box-shadow:
        0 0 15px #22c55e,
        0 0 30px rgba(34,197,94,0.6),
        inset 0 0 10px rgba(34,197,94,0.4);
}

/* GRID */
.grid {
    margin-top: 35px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

/* BOTONES */
.btn {
    position: relative;
    padding: 22px;
    text-align: center;
    cursor: pointer;
    transform: skewX(-20deg);
    border-radius: 12px;
    overflow: hidden;

    background: linear-gradient(135deg, #0ea5e9, #9333ea);

    box-shadow:
        0 0 15px rgba(147,51,234,0.7),
        0 0 25px rgba(14,165,233,0.6);

    transition: 0.25s;
}

/* TEXTO RECTO */
.btn span {
    display: block;
    transform: skewX(20deg);
    font-weight: bold;
    letter-spacing: 1px;
}

/* EFECTO LUZ MOVIÉNDOSE */
.btn::before {
    content: "";
    position: absolute;
    top: 0;
    left: -120%;
    width: 100%;
    height: 100%;
    background: linear-gradient(
        120deg,
        transparent,
        rgba(255,255,255,0.8),
        transparent
    );
    transition: 0.5s;
}

.btn:hover::before {
    left: 120%;
}

/* EFECTO HOVER PRO */
.btn:hover {
    transform: skewX(-20deg) scale(1.08);
    box-shadow:
        0 0 25px #22c55e,
        0 0 40px #38bdf8,
        0 0 60px #9333ea;
}

/* VARIACIONES DE COLOR (cada botón distinto) */
.btn:nth-child(1) {
    background: linear-gradient(135deg, #22c55e, #4ade80);
}

.btn:nth-child(2) {
    background: linear-gradient(135deg, #f59e0b, #f97316);
}

.btn:nth-child(3) {
    background: linear-gradient(135deg, #ec4899, #d946ef);
}

.btn:nth-child(4) {
    background: linear-gradient(135deg, #38bdf8, #6366f1);
}

/* ANIMACIÓN SUAVE DE "RESPIRACIÓN" */
@keyframes glowPulse {
    0% { filter: brightness(1); }
    50% { filter: brightness(1.3); }
    100% { filter: brightness(1); }
}

.btn {
    animation: glowPulse 2.5s infinite;
}

/* RESPONSIVE */
@media (max-width: 500px) {
    .container {
        width: 90%;
    }
}
</style>

</head>
<body>

<div class="container">
    <input class="input-top" type="text" placeholder="Introduce comando...">

    <div class="grid">
        <div class="btn"><span>START</span></div>
        <div class="btn"><span>MISSIONS</span></div>
        <div class="btn"><span>UPGRADES</span></div>
        <div class="btn"><span>GARAGE</span></div>
    </div>
</div>

</body>
</html>
